#!/usr/sbin/nft -f
# Gateway portuna yalnizca Mac, Proxmox host (Tailscale yolu) ve localhost erisir.
table inet aigw
delete table inet aigw
table inet aigw {
  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport 8765 ip saddr { 127.0.0.1, 192.168.7.51, 192.168.7.3 } accept
    tcp dport 8765 counter drop
  }
}
